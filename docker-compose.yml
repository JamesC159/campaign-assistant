name: campaign-assistant

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign
      POSTGRES_DB: campaign
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign -d campaign"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
